# Local dry-run profile for A-MSB-GRPO wiring checks.

model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
model_revision: main
torch_dtype: float32
attn_implementation: eager

dataset_name: data/datasets/requested
dataset_prompt_column: problem
runtime_profile: local-dryrun
method: amsb
amsb_balanced_group_size: 16
amsb_max_error_clusters: 2
amsb_entropy_scale_mode: exp_decay
amsb_entropy_temperature: 1.0
amsb_reflection_prompt: "Review the reasoning carefully. Keep the answer unchanged if it is already correct, otherwise provide a corrected solution."

dry_run: true
dry_run_skip_train: true
dry_run_max_samples: 32

bf16: false
use_vllm: false
do_eval: false
gradient_accumulation_steps: 1
gradient_checkpointing: false
hub_model_id: Qwen2.5-Math-7B-Open-R1-AMSB-DryRun
learning_rate: 2.0e-05
logging_steps: 1
logging_strategy: steps
max_prompt_length: 256
max_completion_length: 256
max_steps: 1
num_generations: 2
num_train_epochs: 1
output_dir: data/Qwen2.5-Math-7B-Open-R1-AMSB-DryRun
overwrite_output_dir: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 2
push_to_hub: false
report_to: []
reward_funcs:
  - accuracy
  - format
  - tag_count
reward_weights:
  - 1.0
  - 1.0
  - 1.0
save_strategy: "no"
seed: 42
warmup_ratio: 0.0
