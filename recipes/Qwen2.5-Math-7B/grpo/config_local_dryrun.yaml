# Local dry-run profile for CPU/iGPU validation.
# This config validates wiring and artifacts, not model quality.

# Model arguments
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
model_revision: main
torch_dtype: float32
attn_implementation: eager

# Data training arguments
dataset_name: data/datasets/requested
dataset_prompt_column: problem
system_prompt: "You are a helpful AI Assistant that provides well-reasoned and detailed responses. You first think about the reasoning process as an internal monologue and then provide the user with the answer. Respond in the following format: <think>\n...\n</think>\n<answer>\n...\n</answer>"
runtime_profile: local-dryrun
method: vanilla
dry_run: true
dry_run_skip_train: true
dry_run_max_samples: 32

# GRPO trainer config (CPU-safe)
bf16: false
use_vllm: false
do_eval: false
gradient_accumulation_steps: 1
gradient_checkpointing: false
hub_model_id: Qwen2.5-Math-7B-Open-R1-GRPO-DryRun
learning_rate: 2.0e-05
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 256
max_completion_length: 256
max_steps: 1
num_generations: 2
num_train_epochs: 1
output_dir: data/Qwen2.5-Math-7B-Open-R1-GRPO-DryRun
overwrite_output_dir: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 2
push_to_hub: false
report_to: []
reward_funcs:
  - accuracy
  - format
  - tag_count
reward_weights:
  - 1.0
  - 1.0
  - 1.0
save_strategy: "no"
seed: 42
warmup_ratio: 0.0
