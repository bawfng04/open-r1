# Local dry-run profile for SEED-style wiring checks.

model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
model_revision: main
torch_dtype: float32
attn_implementation: eager

dataset_name: open-r1/OpenR1-Math-220k
dataset_prompt_column: problem
runtime_profile: local-dryrun
method: seed
seed_entropy_modulation: linear
seed_alpha: 1.0
seed_entropy_normalize: true

dry_run: true
dry_run_skip_train: true
dry_run_max_samples: 32

bf16: false
use_vllm: false
do_eval: false
gradient_accumulation_steps: 1
gradient_checkpointing: false
hub_model_id: Qwen2.5-Math-7B-Open-R1-SEED-DryRun
learning_rate: 2.0e-05
logging_steps: 1
logging_strategy: steps
max_prompt_length: 256
max_completion_length: 256
max_steps: 1
num_generations: 2
num_train_epochs: 1
output_dir: data/Qwen2.5-Math-7B-Open-R1-SEED-DryRun
overwrite_output_dir: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 2
push_to_hub: false
report_to: []
reward_funcs:
  - accuracy
  - format
  - tag_count
reward_weights:
  - 1.0
  - 1.0
  - 1.0
save_strategy: "no"
seed: 42
warmup_ratio: 0.0
